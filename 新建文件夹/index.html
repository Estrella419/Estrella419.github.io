        <img src="tu.jpg" alt="态度决定一切 细节决定成败">
        <ul>
            <li><span>反复确认</span>，做任何事情都要按照每一个细节并反复确认，要有一种能在脑子里“复盘”整个事件过程的能力，确保所有的节点都正常。</li>
            <li>想好的办法努力让不可能变为可能，只有用尽全力去做了，才算是尽力</li>
            <li>凡事秉持一切以结果为导向，任何事情都是你的分内，还要思考事情的结果和过程是否满足所有和你配合的人的需求。</li>
            <li>学会换位思考了解帮助你的人，观察他们的做事方法，遇到让自己束手无策的时候，把自己当成做成他的样子，想想他会怎么做</li>
