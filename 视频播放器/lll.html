<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第三章CSS作业</title>
    <style>
        body{
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle,#b886b8,#633b63);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-box{
            width: 340px;
            height: 340px;
            background: #7a4b7a;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .frame{
            width: 240px;
            height: 200px;
            background: #221a22;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .screen{
            width: 205px;
            height: 165px;
            background: linear-gradient(180deg,#f8b898,#a85868);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-circle{
            width: 100px;
            height: 100px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-tri{
            width: 0;
            height: 0;
            border-top: 25px solid transparent;
            border-bottom: 25px solid transparent;
            border-left: 40px solid #221a22;
        }
    </style>
</head>
<body>
    <div class="player-box">
        <div class="frame">
            <div class="screen">
                <div class="play-tri"></div>
            </div>
        </div>
    </div>
</body>
</html>
